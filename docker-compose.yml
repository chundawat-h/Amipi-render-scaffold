services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: amipi
      POSTGRES_PASSWORD: amipi
      POSTGRES_DB: amipi_render
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  pgdata:
